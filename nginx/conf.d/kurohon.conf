# kurohon-tracker のリバースプロキシ
#
# tailscale serve → nginx(:8080) → kurohon(:8080)
#
# 認証が要らない静的ファイルだけ nginx が直接返す。
# 振り分けは AuthFilter の OPEN 一覧とそろえてあるので、
# ログイン前に見えるものが増えたり減ったりしない。

# 前段が付けた X-Forwarded-Proto をそのまま通す。無ければ自分の scheme を使う。
map $http_x_forwarded_proto $kurohon_proto {
    default  $scheme;
    "~."     $http_x_forwarded_proto;
}

# ログインの総当たり対策。アプリ側にも入っているが、ここで先に落とす。
limit_req_zone $binary_remote_addr zone=kurohon_login:1m rate=10r/m;

server {
    listen 8080;
    server_name _;

    root /srv/web;

    access_log /var/log/nginx/kurohon.access.log;
    error_log  /var/log/nginx/kurohon.error.log warn;

    client_max_body_size 1m;

    gzip on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml;

    # ---- 認証不要の静的ファイル（nginx が直接返す） ----
    location = /login.html          { }
    location = /style.css           { expires 1h; }
    location = /favicon.ico         { access_log off; }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires 1h;
    }

    # Service Worker は必ず最新を取りに行かせる
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location /icons/  { expires 7d;  access_log off; }
    location /vendor/ { expires 30d; access_log off; }

    # ---- ログインだけ流量を絞る ----
    location = /api/login {
        limit_req zone=kurohon_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://kurohon:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $kurohon_proto;
    }

    # ---- 残りはすべてアプリへ ----
    location / {
        proxy_pass http://kurohon:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $kurohon_proto;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
